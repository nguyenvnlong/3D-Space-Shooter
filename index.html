<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Shooter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="lobby-menu">
        <main class="panel">
            <section id="homePanel">
                <h1>3D SPACE SHOOTER</h1>
                <p class="tag">太空射擊 · 和朋友一起守護銀河！(Cùng bạn bè bảo vệ thiên hà!)</p>

                <div class="modes">
                    <button id="modeCoop" class="mode">合作模式 Co-op<small>1-4 người, chủ phòng bắt đầu</small></button>
                    <button id="modePvp" class="mode active">對戰模式 PvP<small>Đấu tay đôi 1 vs 1</small></button>
                </div>

                <label class="field">玩家名稱 (Tên)
                    <input type="text" id="playerName" value="飛船大師" maxlength="12">
                </label>
                <label class="field">選擇戰艦 (Tàu)
                    <select id="shipSelect">
                        <option value="1">Phantom</option>
                        <option value="2">Lightning</option>
                        <option value="3">Titan</option>
                    </select>
                </label>
                <label class="field">選擇地圖 (Map)
                    <select id="mapSelect">
                        <option value="1">Deep Space</option>
                        <option value="2">Asteroid Belt</option>
                    </select>
                </label>

                <div class="actions">
                    <button id="btnCreateRoom" class="act create">建立房間 (Tạo phòng)</button>
                    <button id="btnSolo" class="act solo">單人遊戲 (Chơi một mình)</button>
                </div>
                <div class="joinrow">
                    <input type="text" id="roomCodeInput" placeholder="輸入4位房號" maxlength="4" inputmode="numeric" autocomplete="off">
                    <button id="btnJoinRoom" class="act join">加入房間 (Vào phòng)</button>
                </div>
            </section>

            <section id="waitPanel" class="hidden">
                <h2>房號 (Mã phòng)</h2>
                <div id="roomCodeBig">----</div>
                <p id="waitInfo"></p>
                <ul id="playerList"></ul>
                <button id="btnStart" class="act start hidden">開始遊戲 (Bắt đầu)</button>
            </section>
        </main>
        <div id="statusText" role="status" aria-live="polite">Đang kết nối server...</div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
